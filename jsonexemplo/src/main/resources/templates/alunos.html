<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Lista de Alunos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <div class="container">
        <h1>Lista de Alunos</h1>
        <a th:href="@{/alunos/novo}">
            Cadastrar novo aluno
        </a>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Curso</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="aluno : ${alunos}">
                    <td th:text="${aluno.id}">
                        ID
                    </td>
                    <td th:text="${aluno.nome}">
                        Nome
                    </td>
                    <td th:text="${aluno.idade}">
                        Idade
                    </td>
                    <td th:text="${aluno.curso}">
                        Curso
                    </td>
                    <td>
                        <!-- EDITAR -->
                        <a th:href="@{/alunos/editar/{id}(id=${aluno.id})}">
                            Editar
                        </a>
                        <!-- EXCLUIR -->
                        <a th:href="@{/alunos/excluir/{id}(id=${aluno.id})}">
                            Excluir
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
